<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#14161c" />
    <title>校园导航 · YourTJ</title>
    <meta
      name="description"
      content="同济校园常用站点导航：教学系统、课程平台、办事服务与实用工具，一处进入。"
    />
    <link rel="icon" href="./yourtj-logo.png" type="image/png" />
    <link
      rel="preload"
      href="/fonts/Geist-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      /*
        Paint the remembered wallpaper before React mounts, so a warm cache has
        no empty frame at all. React's <img> layers then sit on top of it.
      */
      (function () {
        try {
          var source = localStorage.getItem("yourtj-nav-wallpaper");
          if (source === "custom") return;
          var last = JSON.parse(localStorage.getItem("yourtj-nav-wallpaper-last") || "{}");
          if (!last) return;
          var entry = source ? last[source] : null;
          if (!entry) {
            // No stored source: take the newest cached entry. Picking a literal
            // here would silently drift from defaultSourceId in the data layer.
            Object.keys(last).forEach(function (key) {
              var item = last[key];
              if (!item || typeof item.url !== "string") return;
              if (!entry || (item.at || 0) > (entry.at || 0)) entry = item;
            });
          }
          if (entry && typeof entry.url === "string" && entry.url.indexOf("http") === 0) {
            document.documentElement.style.setProperty(
              "--boot-wall",
              'url("' + entry.url.replace(/"/g, "") + '")'
            );
          }
        } catch (error) {
          /* No cache: the bundled gradient in CSS takes over. */
        }
      })();
    </script>
    <script>
      // Resolve the appearance before first paint so the page never flashes.
      (function () {
        try {
          var saved = localStorage.getItem("yourtj-nav-theme")
          var followsSystem = !saved || saved === "system"
          var dark =
            saved === "dark" ||
            (followsSystem && window.matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.toggle("dark", dark)
          var material = localStorage.getItem("yourtj-nav-material")
          if (material === "acrylic" || material === "liquid" || material === "frosted") {
            document.documentElement.dataset.material = material
          }
          document.documentElement.style.colorScheme = dark ? "dark" : "light"
        } catch (e) {}
      })()
    </script>
    <style>
      html,
      body {
        margin: 0;
        background-color: #14161c;
      }
      html:not(.dark),
      html:not(.dark) body {
        background-color: #eef1f5;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
