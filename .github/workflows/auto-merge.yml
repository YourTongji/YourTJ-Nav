name: Auto-merge approved site PRs

# 只对 site-request 机器人生成的 PR 生效：维护者点 Approve 即合入，
# 合入后 deploy.yml 自动重新发布。人工 PR 不受影响，仍按常规流程走。
on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: |
      github.event.review.state == 'approved' &&
      contains(github.event.pull_request.labels.*.name, 'site-request') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # --auto：检查还没落地时排队，而不是直接报错。手动合一次也行。
      - name: Squash merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR" --squash --auto --delete-branch --repo "$GITHUB_REPOSITORY" \
            || gh pr merge "$PR" --squash --delete-branch --repo "$GITHUB_REPOSITORY"

      # PR 正文里的 Closes #N 会在合入时自动关单，这里只负责留言，
      # 并兜底处理「关单没生效」的情况（比如 PR 正文被改过）。
      - name: Comment on the source issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          ISSUE=$(printf '%s' "$PR_BODY" | grep -oE '#[0-9]+' | head -1 | tr -d '#')
          if [ -z "$ISSUE" ]; then
            echo "PR 正文里没有关联 Issue，跳过"
            exit 0
          fi

          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "已合入：$PR_URL。站点会在下一次部署后生效。"

          STATE=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          if [ "$STATE" = "OPEN" ]; then
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" \
              --reason completed --comment "已合入 #${{ github.event.pull_request.number }}，自动关闭。"
          fi
