name: Site request → PR

# 把「补充站点」Issue 变成一个只改 src/data/sites.ts 的 PR。
# 维护者 Approve 后由 auto-merge.yml 合入，deploy.yml 随后重新发布。
on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: site-request-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  propose:
    # 两个条件满足其一就处理：带 site-request 标签，或者标题以 [Site] 开头。
    # 后者是兜底：模板里写的 labels 只有在仓库已存在同名标签时才生效，
    # 标签缺失时 Issue 会静默地不带标签，只认标签就永远跑不起来。
    if: |
      contains(github.event.issue.labels.*.name, 'site-request') ||
      startsWith(github.event.issue.title, '[Site]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create site-request --repo "$GITHUB_REPOSITORY" \
            --color 1d76db --description "自动生成站点 PR 的请求" --force
          gh label create site --repo "$GITHUB_REPOSITORY" \
            --color 0e8a16 --description "站点数据" --force

      - name: Apply issue to src/data/sites.ts
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/add-site.mjs

      - name: Type-check the result
        run: |
          npm ci
          npx tsc -b

      - name: Open or update the pull request
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: site/issue-${{ github.event.issue.number }}
          base: main
          delete-branch: true
          labels: site-request
          add-paths: src/data/sites.ts
          commit-message: "feat(sites): 补充站点 #${{ github.event.issue.number }}"
          title: "feat(sites): ${{ github.event.issue.title }}"
          body: |
            由 #${{ github.event.issue.number }} 自动生成，只改动 `src/data/sites.ts`。

            - 站点：${{ github.event.issue.title }}
            - 分类与地址来自 Issue 表单，解析结果见上一步日志

            **审核要点**：分类是否合适、地址是否可访问、是否是推广或镜像站。
            Approve 后会自动合入并触发部署；要改内容请直接编辑 Issue，PR 会跟着更新。

      # 补上标签，方便后续按标签筛选，也让 labeled 事件成为第二次触发的入口。
      - name: Label the issue
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          HAS_LABEL: ${{ contains(github.event.issue.labels.*.name, 'site-request') }}
        run: |
          if [ "$HAS_LABEL" != "true" ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label site-request
          fi
