name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 配置好 secrets 后在 Settings → Variables 设 SERVER_DEPLOY_ENABLED=true 启用；
    # 未启用时跳过而非失败。
    if: ${{ vars.SERVER_DEPLOY_ENABLED == 'true' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 服务器部署在根路径，与 Pages 的 base_path 无关。
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # 指纹固定：来自服务器 /etc/ssh/ssh_host_ed25519_key.pub，不做 keyscan。
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload dist
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          tar -czf /tmp/yourtj-dist.tgz -C dist .
          scp -i ~/.ssh/id_deploy /tmp/yourtj-dist.tgz yourtj-nav@"$DEPLOY_HOST":/tmp/yourtj-dist.tgz

      # 原子切换。自检失败自动切回上一版。保留最近 3 个版本目录用于回滚。
      - name: Atomic switch
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy yourtj-nav@"$DEPLOY_HOST" 'bash -s' -- "$GITHUB_SHA" <<'EOF'
          set -euo pipefail
          BASE=/var/www/yourtj-nav
          REL="$BASE/${1:0:12}"
          # 同 SHA 重跑时先清空，避免上一次解压的多余文件残留。
          rm -rf "$REL"
          mkdir -p "$REL"
          tar -xzf /tmp/yourtj-dist.tgz -C "$REL"
          test -f "$REL/index.html"
          rm /tmp/yourtj-dist.tgz
          PREV="$(readlink -f "$BASE/current" || true)"
          ln -sfn "$REL" "$BASE/current.new"
          mv -T "$BASE/current.new" "$BASE/current"
          # 严格 200 才算健康（-f 会放过 3xx），失败即回滚。
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 --resolve n.yourtj.de:443:127.0.0.1 https://n.yourtj.de/)"
          if [ "$code" != "200" ]; then
            if [ -n "$PREV" ]; then
              ln -sfn "$PREV" "$BASE/current.new"
              mv -T "$BASE/current.new" "$BASE/current"
            fi
            echo "health check failed (http=$code), rolled back to $PREV" >&2
            exit 1
          fi
          cd "$BASE"
          # 只清理 12 位提交哈希命名的版本目录，且永不删除当前在用版本。
          CUR="$(basename "$(readlink current)")"
          ls -1t | grep -E '^[0-9a-f]{12}$' | grep -vxF "$CUR" | tail -n +3 | xargs -r rm -rf --
          echo "deployed $REL"
          EOF
