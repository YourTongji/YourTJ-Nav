name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 服务器部署在根路径，与 Pages 的 base_path 无关。
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /

      - name: Prepare SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload dist
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          tar -czf /tmp/yourtj-dist.tgz -C dist .
          scp -i ~/.ssh/id_deploy /tmp/yourtj-dist.tgz yourtj-nav@"$DEPLOY_HOST":/tmp/yourtj-dist.tgz

      # 原子切换。自检失败自动切回上一版。保留最近 3 个版本目录用于回滚。
      - name: Atomic switch
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy yourtj-nav@"$DEPLOY_HOST" 'bash -s' -- "$GITHUB_SHA" <<'EOF'
          set -euo pipefail
          BASE=/var/www/yourtj-nav
          REL="$BASE/${1:0:12}"
          mkdir -p "$REL"
          tar -xzf /tmp/yourtj-dist.tgz -C "$REL"
          rm /tmp/yourtj-dist.tgz
          test -f "$REL/index.html"
          PREV="$(readlink -f "$BASE/current" || true)"
          ln -sfn "$REL" "$BASE/current.new"
          mv -T "$BASE/current.new" "$BASE/current"
          # 失败即回滚。
          if ! curl -sf -o /dev/null --resolve n.yourtj.de:443:127.0.0.1 https://n.yourtj.de/; then
            if [ -n "$PREV" ]; then
              ln -sfn "$PREV" "$BASE/current.new"
              mv -T "$BASE/current.new" "$BASE/current"
            fi
            echo "health check failed, rolled back to $PREV" >&2
            exit 1
          fi
          cd "$BASE"
          # 只清理 12 位提交哈希命名的版本目录，且永不删除当前在用版本。
          CUR="$(basename "$(readlink current)")"
          ls -1t | grep -E '^[0-9a-f]{12}$' | grep -vxF "$CUR" | tail -n +3 | xargs -r rm -rf --
          echo "deployed $REL"
          EOF
